[package]
name = "back_pos"
version = "0.1.0-dev.1"
edition = "2024"

[profile.dev]
incremental = true

[profile.release]
opt-level = 3
lto = true

[dependencies]
actix-web = "4.18.1"
actix-cors = "0.7.2"
tokio = { version = "1.54.1", features = [
    "full",
] }
dotenvy = "0.15.7"
env_logger = "0.11.11"
log = "0.4.34"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "mysql",
    "chrono",
    "uuid",
    "rust_decimal",
    "migrate",
] }
rust_decimal = { version = "1.43.0", features = [
    "serde",
] }
rand = "0.10.3"
serde = { version = "1.0.229", features = [
    "derive",
] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = [
    "v4",
    "serde",
] }
chrono = { version = "0.4.45", features = [
    "serde",
] }
bcrypt = "0.19.3"
jsonwebtoken = "11.1.0"
rxing = "0.9.3"
