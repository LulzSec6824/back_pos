[package]
name = "back_pos"
version = "0.1.0-alpha.1"
edition = "2024"

[profile.dev]
incremental = true

[profile.release]
opt-level = 3
lto = true

[dependencies]
actix-web = "4.17.0"
tokio = { version = "1.54.0", features = [
    "full",
] }
dotenvy = "0.15.7"
env_logger = "0.11.11"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "mysql",
    "chrono",
    "uuid",
] }
serde = { version = "1.0.229", features = [
    "derive",
] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = [
    "v4",
    "serde",
] }
chrono = { version = "0.4.45", features = [
    "serde",
] }
bcrypt = "0.19.3"
jsonwebtoken = "11.1.0"
